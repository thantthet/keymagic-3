<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Layout</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      padding: 20px;
      padding-top: 45px;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body.macos {
      padding-top: 48px;
    }

    /* Header is hidden on screen (name lives in titlebar) and only shown in print */
    .layout-header {
      display: none;
    }

    .layout-header h1 {
      color: #333;
      font-size: 24px;
    }

    /* Custom titlebar: shown by default for Windows/Linux (decorations: false) */
    .titlebar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: #e8e8e8;
      border-bottom: 1px solid #d0d0d0;
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      z-index: 100;
    }

    .titlebar-drag {
      height: 100%;
      display: flex;
      align-items: center;
      padding-left: 12px;
    }

    .titlebar-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      max-width: 60%;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }

    .titlebar-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 4px;
    }

    .titlebar-controls {
      display: flex;
      align-items: center;
    }

    .titlebar-controls button {
      appearance: none;
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      cursor: pointer;
      color: #555;
    }

    .titlebar-controls button:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .titlebar-controls button.close:hover {
      background: #e81123;
      color: white;
    }

    .titlebar-controls button svg {
      width: 10px;
      height: 10px;
    }

    .layout-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn {
      padding: 5px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    
    .btn-primary {
      background: #2196F3;
      color: white;
    }
    
    .btn-primary:hover {
      background: #1976D2;
    }
    
    .btn-secondary {
      background: #e0e0e0;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #d0d0d0;
    }
    
    .icon-btn {
      appearance: none;
      border: none;
      background: transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: #555;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    .icon-btn.pinned {
      background: rgba(255, 193, 7, 0.25);
      color: #b8860b;
    }

    .icon-btn.pinned:hover {
      background: rgba(255, 193, 7, 0.35);
    }
    
    .keyboard-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      padding: 20px 20px 0;
    }
    
    .keyboard-layout {
      max-width: 1085px;
      width: 100%;
      background: #efeff2;
      border: 1px solid #e8e8ed;
      border-radius: 16px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(30, 1fr);
      grid-template-rows: repeat(5, 60px);
      gap: 5px;
    }
    
    .key {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      position: relative;
      font-size: 15px;
      transition: border-color 0.1s, background 0.1s;
      grid-column: span 2;
      min-width: 0; /* Prevent grid blowout */
    }

    .key:hover {
      background: #fafafa;
      border-color: #b8b8bd;
    }
    
    /* Key size modifiers using grid spans */
    .key.backspace { grid-column: span 4; }
    .key.tab { grid-column: span 3; }
    .key.backslash { grid-column: span 3; }
    .key.caps { grid-column: span 4; }
    .key.enter { grid-column: span 4; }
    .key.shift-left { grid-column: span 5; }
    .key.shift-right { grid-column: span 5; }
    .key.ctrl { grid-column: span 3; }
    .key.alt { grid-column: span 3; }
    .key.win { grid-column: span 3; }
    .key.menu { grid-column: span 3; }
    .key.space { grid-column: span 9; }
    
    .key-ascii,
    .key-label {
      position: absolute;
      top: 5px;
      left: 7px;
      font-size: 10px;
      color: #888;
      font-weight: 500;
      line-height: 1;
    }

    .key-label {
      text-transform: uppercase;
    }

    .key-shifted {
      position: absolute;
      top: 5px;
      right: 7px;
      font-size: 13px;
      color: #444;
      line-height: 1;
    }

    .key-unshifted {
      position: absolute;
      bottom: 6px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 16px;
      font-weight: 500;
      color: #1d1d1f;
      line-height: 1;
    }
    
    /* Responsive adjustments */
    @media (max-width: 1200px) {
      .keyboard-layout {
        grid-template-columns: repeat(30, minmax(0, 1fr));
        grid-template-rows: repeat(5, max(50px, 5vw));
      }

      .key-shifted {
        font-size: 11px;
      }

      .key-unshifted {
        font-size: 14px;
      }

      .key-ascii,
      .key-label {
        font-size: 9px;
      }
    }

    @media (max-width: 800px) {
      .keyboard-layout {
        grid-template-rows: repeat(5, minmax(25px, max(40px, 4vw)));
        gap: 3px;
        padding: 10px;
      }

      .key-shifted {
        font-size: 9px;
        top: 3px;
        right: 4px;
      }

      .key-unshifted {
        font-size: 12px;
      }

      .key-ascii,
      .key-label {
        font-size: 8px;
        top: 3px;
        left: 4px;
      }
    }
    
    /* Compact mode - hide everything except keyboard when window is small */
    @media (max-width: 500px), (max-height: 350px) {
      body {
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
      }
      
      .layout-header,
      .layout-actions,
      .info-footer {
        display: none;
      }

      .titlebar {
        height: 30px;
      }

      .titlebar-controls button {
        width: 30px;
        height: 30px;
      }
      
      .keyboard-container {
        min-height: unset;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      
      .keyboard-layout {
        padding: 8px;
        grid-template-rows: repeat(5, minmax(20px, 45px));
        gap: 2px;
        border-radius: 8px;
        width: 100%;
        max-width: 600px;
        height: auto;
      }
      
      .key {
        border-width: 1px;
        border-radius: 4px;
      }
      
      .key-shifted {
        font-size: 8px;
        top: 2px;
        right: 3px;
      }

      .key-unshifted {
        font-size: 10px;
      }

      .key-ascii,
      .key-label {
        font-size: 7px;
        top: 2px;
        left: 3px;
      }
    }
    
    /* macOS: overlay title bar — traffic lights are native, content extends behind */
    body.macos {
      padding-top: 48px;
    }

    body.macos .titlebar {
      background: linear-gradient(
        to bottom,
        #ffffff 0%,
        #ffffff 60%,
        rgba(255, 255, 255, 0.85) 100%
      );
      border-bottom: none;
      height: 38px;
      grid-template-columns: 1fr auto;
      align-items: center;
    }

    /* Soft fade strip below the titlebar so content gradually appears as it scrolls out */
    body.macos .titlebar::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      height: 24px;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.85) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
    }

    body.macos .titlebar-drag {
      /* Keep drag region but leave space for traffic lights */
      padding-left: 76px;
      height: 100%;
      display: flex;
      align-items: center;
    }

    body.macos .titlebar-controls {
      display: none;
    }

    body.macos .titlebar-actions {
      padding-right: 12px;
    }

    /* Hide inline actions — buttons are in the titlebar on all platforms */
    .layout-actions {
      display: none;
    }

    .loading {
      text-align: center;
      color: #666;
    }
    
    .error {
      text-align: center;
      color: #f44336;
    }
    
    .info-footer {
      margin-top: 14px;
      text-align: center;
      color: #888;
      font-size: 11px;
      padding: 0;
    }

    .info-footer p {
      margin: 2px 0;
    }
    
    @media print {
      body {
        background: white;
        padding: 10px;
        padding-top: 10px;
      }

      .titlebar,
      .layout-actions {
        display: none;
      }

      .layout-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        gap: 12px;
      }
      
      .keyboard-container {
        padding: 0;
      }
      
      .keyboard-layout {
        box-shadow: none;
        border: 1px solid #ddd;
        background: white;
        max-width: 100%;
        grid-template-columns: repeat(30, 1fr);
        grid-template-rows: repeat(5, 45px);
      }
      
      .key {
        box-shadow: none;
        border: 1px solid #999;
      }
      
      .key:hover {
        background: #fafafa;
        transform: none;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-drag" data-tauri-drag-region>
      <span class="titlebar-title" id="titlebar-name" data-tauri-drag-region>Keyboard Layout</span>
    </div>
    <div class="titlebar-actions">
      <button class="icon-btn" id="pin-button" onclick="togglePin()" title="Pin window on top" aria-label="Pin window on top">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="4" x2="16" y2="4"/>
          <path d="M9 4v6l-2 3v2h10v-2l-2-3V4"/>
          <line x1="12" y1="15" x2="12" y2="20"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="exportPDF()" title="Export as PDF" aria-label="Export as PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>
    </div>
    <div class="titlebar-controls">
      <button id="titlebar-minimize" title="Minimize">
        <svg viewBox="0 0 12 12"><path fill="currentColor" d="M2 6h8v1H2z"/></svg>
      </button>
      <button id="titlebar-maximize" title="Maximize">
        <svg viewBox="0 0 12 12"><path fill="currentColor" d="M2 2h8v8H2zm1 1v6h6V3z"/></svg>
      </button>
      <button id="titlebar-close" class="close" title="Close">
        <svg viewBox="0 0 12 12"><path fill="currentColor" d="M1.5 0L6 4.5 10.5 0 12 1.5 7.5 6 12 10.5 10.5 12 6 7.5 1.5 12 0 10.5 4.5 6 0 1.5z"/></svg>
      </button>
    </div>
  </div>

  <div class="layout-header">
    <h1 id="keyboard-name">Loading...</h1>
    <div class="layout-actions" id="layout-actions">
      <button class="btn btn-pin" id="pin-button-inline" onclick="togglePin()" title="Pin window on top">
        📌
      </button>
      <button class="btn btn-primary" onclick="exportPDF()">Export as PDF</button>
    </div>
  </div>
  
  <div class="keyboard-container" id="keyboard-container">
    <div class="loading">Loading keyboard layout...</div>
  </div>

  <div class="info-footer">
    <p>Shifted characters are shown in the top-left corner of each key</p>
    <p>Unshifted characters are shown in the center</p>
  </div>
  
  <script type="module">
    const { invoke } = window.__TAURI__.core;
    const { WebviewWindow } = window.__TAURI__.webviewWindow;
    const { getCurrentWindow } = window.__TAURI__.window;

    // Window controls
    const appWindow = getCurrentWindow();
    document.getElementById('titlebar-minimize')?.addEventListener('click', () => appWindow.minimize());
    document.getElementById('titlebar-maximize')?.addEventListener('click', () => appWindow.toggleMaximize());
    document.getElementById('titlebar-close')?.addEventListener('click', () => appWindow.close());

    let layoutData = null;
    let platformOs = 'windows';

    // Get keyboard ID from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const keyboardId = urlParams.get('keyboardId');

    // Load keyboard layout data on window load
    async function loadKeyboardLayout() {
      if (!keyboardId) {
        document.getElementById('keyboard-container').innerHTML = '<div class="error">No keyboard ID provided</div>';
        return;
      }

      try {
        const [info, data] = await Promise.all([
          invoke('get_platform_info').catch(() => null),
          invoke('get_keyboard_layout', { keyboardId })
        ]);

        platformOs = info?.os || 'windows';
        if (platformOs === 'macos') {
          document.body.classList.add('macos');
        }
        layoutData = data;
        displayKeyboardLayout();
      } catch (error) {
        console.error('Failed to load keyboard layout:', error);
        document.getElementById('keyboard-container').innerHTML = '<div class="error">Failed to load keyboard layout</div>';
      }
    }
    
    function displayKeyboardLayout() {
      const container = document.getElementById('keyboard-container');
      const nameElement = document.getElementById('keyboard-name');
      
      if (!layoutData) {
        container.innerHTML = '<div class="error">Failed to load keyboard layout</div>';
        return;
      }
      
      nameElement.textContent = `${layoutData.keyboard_name} - Keyboard Layout`;
      document.getElementById('titlebar-name').textContent = layoutData.keyboard_name;

      const { keys } = layoutData;

      // Platform-specific modifier labels
      const altLabel = platformOs === 'macos' ? 'OPT' : 'ALT';
      const winLabel = platformOs === 'macos' ? 'CMD'
                     : platformOs === 'linux' ? 'SUPER'
                     : 'WIN';

      container.innerHTML = `
        <div class="keyboard-layout">
          <!-- Number row -->
          <div class="key">
            <span class="key-ascii">${'`'}</span>
            <span class="key-shifted">${keys['Backquote']?.shifted || '~'}</span>
            <span class="key-unshifted">${keys['Backquote']?.unshifted || '`'}</span>
          </div>
          ${[1,2,3,4,5,6,7,8,9,0].map(n => `
            <div class="key">
              <span class="key-ascii">${n}</span>
              <span class="key-shifted">${keys['Digit' + n]?.shifted || ''}</span>
              <span class="key-unshifted">${keys['Digit' + n]?.unshifted || n}</span>
            </div>
          `).join('')}
          <div class="key">
            <span class="key-ascii">-</span>
            <span class="key-shifted">${keys['Minus']?.shifted || '_'}</span>
            <span class="key-unshifted">${keys['Minus']?.unshifted || '-'}</span>
          </div>
          <div class="key">
            <span class="key-ascii">=</span>
            <span class="key-shifted">${keys['Equal']?.shifted || '+'}</span>
            <span class="key-unshifted">${keys['Equal']?.unshifted || '='}</span>
          </div>
          <div class="key backspace">
            <span class="key-label">BACKSPACE</span>
          </div>

          <!-- Top row -->
          <div class="key tab">
            <span class="key-label">TAB</span>
          </div>
          ${['Q','W','E','R','T','Y','U','I','O','P'].map(letter => `
            <div class="key">
              <span class="key-ascii">${letter}</span>
              <span class="key-shifted">${keys['Key' + letter]?.shifted || letter}</span>
              <span class="key-unshifted">${keys['Key' + letter]?.unshifted || letter.toLowerCase()}</span>
            </div>
          `).join('')}
          <div class="key">
            <span class="key-ascii">[</span>
            <span class="key-shifted">${keys['BracketLeft']?.shifted || '{'}</span>
            <span class="key-unshifted">${keys['BracketLeft']?.unshifted || '['}</span>
          </div>
          <div class="key">
            <span class="key-ascii">]</span>
            <span class="key-shifted">${keys['BracketRight']?.shifted || '}'}</span>
            <span class="key-unshifted">${keys['BracketRight']?.unshifted || ']'}</span>
          </div>
          <div class="key backslash">
            <span class="key-ascii">\\</span>
            <span class="key-shifted">${keys['Backslash']?.shifted || '|'}</span>
            <span class="key-unshifted">${keys['Backslash']?.unshifted || '\\\\'}</span>
          </div>

          <!-- Home row -->
          <div class="key caps">
            <span class="key-label">CAPS LOCK</span>
          </div>
          ${['A','S','D','F','G','H','J','K','L'].map(letter => `
            <div class="key">
              <span class="key-ascii">${letter}</span>
              <span class="key-shifted">${keys['Key' + letter]?.shifted || letter}</span>
              <span class="key-unshifted">${keys['Key' + letter]?.unshifted || letter.toLowerCase()}</span>
            </div>
          `).join('')}
          <div class="key">
            <span class="key-ascii">;</span>
            <span class="key-shifted">${keys['Semicolon']?.shifted || ':'}</span>
            <span class="key-unshifted">${keys['Semicolon']?.unshifted || ';'}</span>
          </div>
          <div class="key">
            <span class="key-ascii">'</span>
            <span class="key-shifted">${keys['Quote']?.shifted || '"'}</span>
            <span class="key-unshifted">${keys['Quote']?.unshifted || "'"}</span>
          </div>
          <div class="key enter">
            <span class="key-label">ENTER</span>
          </div>

          <!-- Bottom row -->
          <div class="key shift-left">
            <span class="key-label">SHIFT</span>
          </div>
          ${['Z','X','C','V','B','N','M'].map(letter => `
            <div class="key">
              <span class="key-ascii">${letter}</span>
              <span class="key-shifted">${keys['Key' + letter]?.shifted || letter}</span>
              <span class="key-unshifted">${keys['Key' + letter]?.unshifted || letter.toLowerCase()}</span>
            </div>
          `).join('')}
          <div class="key">
            <span class="key-ascii">,</span>
            <span class="key-shifted">${keys['Comma']?.shifted || '<'}</span>
            <span class="key-unshifted">${keys['Comma']?.unshifted || ','}</span>
          </div>
          <div class="key">
            <span class="key-ascii">.</span>
            <span class="key-shifted">${keys['Period']?.shifted || '>'}</span>
            <span class="key-unshifted">${keys['Period']?.unshifted || '.'}</span>
          </div>
          <div class="key">
            <span class="key-ascii">/</span>
            <span class="key-shifted">${keys['Slash']?.shifted || '?'}</span>
            <span class="key-unshifted">${keys['Slash']?.unshifted || '/'}</span>
          </div>
          <div class="key shift-right">
            <span class="key-label">SHIFT</span>
          </div>
          
          <!-- Space row -->
          <div class="key ctrl">
            <span class="key-label">CTRL</span>
          </div>
          <div class="key win">
            <span class="key-label">${winLabel}</span>
          </div>
          <div class="key alt">
            <span class="key-label">${altLabel}</span>
          </div>
          <div class="key space">
            <span class="key-unshifted">${keys['Space']?.unshifted || ' '}</span>
          </div>
          <div class="key alt">
            <span class="key-label">${altLabel}</span>
          </div>
          <div class="key win">
            <span class="key-label">${winLabel}</span>
          </div>
          <div class="key menu">
            <span class="key-label">MENU</span>
          </div>
          <div class="key ctrl">
            <span class="key-label">CTRL</span>
          </div>
        </div>
      `;
    }
    
    window.exportPDF = async function() {
      try {
        const { getCurrentWebview } = window.__TAURI__.webview;
        const webview = getCurrentWebview();
        await webview.print();
      } catch (error) {
        console.error('Print failed:', error);
        // Fallback to window.print()
        window.print();
      }
    }
    
    // Pin functionality
    let isPinned = false;
    
    window.togglePin = async function() {
      const currentWindow = WebviewWindow.getCurrent();
      isPinned = !isPinned;

      try {
        await currentWindow.setAlwaysOnTop(isPinned);

        // Update all pin buttons
        for (const id of ['pin-button', 'pin-button-inline']) {
          const btn = document.getElementById(id);
          if (!btn) continue;
          if (isPinned) {
            btn.classList.add('pinned');
            btn.title = 'Unpin window';
          } else {
            btn.classList.remove('pinned');
            btn.title = 'Pin window on top';
          }
        }
      } catch (error) {
        console.error('Failed to toggle pin state:', error);
      }
    }
    
    
    // Load the keyboard layout when the page loads
    window.addEventListener('DOMContentLoaded', loadKeyboardLayout);
  </script>
</body>
</html>
